<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Transparent background, so the mark sits on the browser's own tab
       colour. Inverts in dark mode rather than becoming invisible. */
    .mark { fill: #111; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #fdfdfb; }
    }
  </style>
  <!-- Italic exclamation mark: a slanted tapering bar over a dot,
       drawn as geometry rather than text so it renders identically
       everywhere regardless of installed fonts. -->
  <polygon class="mark" points="16.8,4.5 22.6,4.5 19.3,20.5 15.5,20.5"/>
  <circle class="mark" cx="16.5" cy="25.8" r="3"/>
</svg>
